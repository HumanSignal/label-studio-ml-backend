version: "3.8"

services:
  redefiner:
    container_name: redefiner
    image: heartexlabs/label-studio-ml-backend:redefiner-master
    build:
      context: .
      args:
        TEST_ENV: ${TEST_ENV}
    environment:
      # specify these parameters if you want to use basic auth for the model server
      - BASIC_AUTH_USER=
      - BASIC_AUTH_PASS=
      # set the log level for the model server
      - LOG_LEVEL=DEBUG
      # specify the number of workers and threads for the model server
      # (each worker loads its own copy of the model, about 1.5 GB of memory)
      - WORKERS=1
      - THREADS=8
      # specify the model directory (likely you don't need to change this)
      - MODEL_DIR=/data/models
      # keep the downloaded model weights between container restarts
      - HF_HOME=/data/.cache/huggingface

      # ReDefiNER model page on Hugging Face
      - REDEFINER_MODEL=jungroo-ai/redefiner-0.8b
      # Rulebook: leave empty to build it from the labeling config (each <Label> with its hint as the description),
      # or set it to a rulebook file, a folder of <project id>.txt rulebooks, or "default" for the model page's own
      # rulebook (e.g. with REDEFINER_MODEL=jungroo-ai/redefiner-pii)
      - RULEBOOK=
      # minimum span probability; empty uses the model's default (0.5)
      - THRESHOLD=
      # cpu or cuda; empty uses a GPU when one is available
      - DEVICE=

      # Specify the Label Studio URL and API key to access
      # uploaded, local storage and cloud storage files.
      # Do not use 'localhost' as it does not work within Docker containers.
      # Use prefix 'http://' or 'https://' for the URL always.
      # Determine the actual IP using 'ifconfig' (Linux/Mac) or 'ipconfig' (Windows).
      - LABEL_STUDIO_URL=http://host.docker.internal:8080
      - LABEL_STUDIO_API_KEY=
    extra_hosts:
      - "host.docker.internal:host-gateway"  # for macos and unix
    ports:
      - "9090:9090"
    volumes:
      - "./data/server:/data"
